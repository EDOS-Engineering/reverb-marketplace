name: tests

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: '12.*' }
          - { php: '8.3', laravel: '12.*' }
          - { php: '8.3', laravel: '13.*' }
          - { php: '8.4', laravel: '13.*' }
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer require "illuminate/support:${{ matrix.laravel }}" "illuminate/http:${{ matrix.laravel }}" "illuminate/contracts:${{ matrix.laravel }}" --no-interaction --no-update
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpunit

  # The one check the branch ruleset requires. A matrix reports a check
  # per cell, and their names change with the matrix, so the ruleset
  # points here instead: green only when every cell is.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.tests.result }}" = "success"
